[package]
name = "git-log-ratatui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
arboard = "3"
unicode-width = "0.2"
libc = "0.2"
git2 = "0.20"
git-graph = "0.7"
similar = "3.1.1"
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22.1"
terminfo = "0.9"
